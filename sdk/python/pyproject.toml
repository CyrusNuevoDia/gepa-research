[project]
name = "gepa-research-agent"
version = "0.1.0"
description = "Lightweight reporting SDK for GEPAResearch experiments. Zero dependencies."
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/CyrusNuevoDia/geparesearch"
Repository = "https://github.com/CyrusNuevoDia/geparesearch"
Issues = "https://github.com/CyrusNuevoDia/geparesearch/issues"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
